[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isharati"
version = "1.0.0"
description = "Grounded answers about Islam from the Qur'an and hadith, signed in ASL and Arabic Sign Language"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fatimah Emad Eldin" }, { name = "Asmaa Al-Mirghani" }]
dependencies = [
  "numpy>=1.26,<2",
  "requests>=2.31",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "pydantic>=2",
  "huggingface_hub>=1.0",
  "opencv-python-headless>=4.9",
  "imageio>=2.34",
  "imageio-ffmpeg>=0.5",
  "zeyrek>=0.1.3",
]

[project.optional-dependencies]
# building lexicons from video, corpora and embeddings (not needed to run the app)
data = ["mediapipe>=0.10.14", "yt-dlp", "py7zr", "sentence-transformers", "scipy", "matplotlib", "pillow"]
dev = ["pytest>=8", "httpx"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
isharati = ["app/ui.html", "app/static/*", "lexicon/synonyms.json", "lexicon/synonyms_ar.json", "lexicon/synonyms_tr.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: long-running tests"]
